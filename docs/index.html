<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Velora — Updates</title>
<style>
:root{--bg:#0b1020;--cyan:#55d7e8;--mag:#e85ac8;--txt:#e8f7ff;--sub:#a9dce8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0%,#16213d 0,#0b1020 55%);color:var(--txt);font-family:system-ui,Segoe UI,sans-serif}
main{width:min(680px,92vw);padding:48px 36px;border:1px solid #23405a;border-radius:28px;background:#0d1424ee;box-shadow:0 30px 80px #0008}
h1{margin:0 0 8px;font-size:42px;letter-spacing:.18em;font-weight:300}.v{color:var(--cyan);font-weight:600}
p{color:var(--sub);line-height:1.6}.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
a{display:inline-block;padding:14px 20px;border-radius:14px;background:linear-gradient(90deg,var(--cyan),var(--mag));color:#08101d;text-decoration:none;font-weight:700}
code{color:var(--cyan)}
</style>
</head>
<body><main><h1>VELORA</h1><p>Latest version: <span class="v" id="version">...</span> — build <span id="build">...</span></p><p id="notes">Loading...</p><div class="row"><a id="download" href="#">Download latest</a></div><p style="margin-top:28px;font-size:13px">Endpoint: <code>latest.json</code></p></main>
<script>fetch('latest.json',{cache:'no-store'}).then(r=>r.json()).then(j=>{document.getElementById('version').textContent='v'+j.version;document.getElementById('build').textContent=j.build;document.getElementById('notes').textContent=j.notes||'';document.getElementById('download').href=j.url||'#'}).catch(()=>{document.getElementById('notes').textContent='Unable to read latest.json'})</script></body></html>
